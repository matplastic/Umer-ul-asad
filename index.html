<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAT-ERP SYSTEM</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Installable web app (PWA): lets staff add MAT-ERP to their phone's home screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="MAT ERP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MAT ERP" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  
    <!-- Apply the saved light/dark choice before the first paint (no white flash) -->
    <script>
      try {
        if (localStorage.getItem('mat-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#0b1117');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
