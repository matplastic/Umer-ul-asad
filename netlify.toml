# Netlify deployment configuration for MAT-ERP SYSTEM
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Safety-net stock check: e-mails if any followed material is at/below its
# Reorder or Urgent level (the app also triggers this check instantly whenever
# stock changes). Runs on the published production deploy only.
[functions."stock-alert-scheduled"]
  schedule = "*/15 * * * *"

# Installable phone app (PWA). The service worker file must never be cached by the
# browser/CDN, otherwise phones would not pick up new versions after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Nightly full-database backup into Firestore (system_backups). Runs at 20:00 UTC =
# midnight in the UAE. It starts daily-backup-background, which does the actual
# work (background functions may run up to 15 minutes). Production deploy only.
[functions."daily-backup-scheduled"]
  schedule = "0 20 * * *"

# HR expiry reminder e-mails (passports, visas, Emirates ID, labour cards…): every day at
# 04:00 UTC = 08:00 UAE time. Production deploy only.
[functions."hr-expiry-scheduled"]
  schedule = "0 4 * * *"

# Daily Store Report e-mail (consumption, incoming material, QC waiting list, current stock):
# every day at 03:00 UTC = 07:00 UAE time, covering yesterday. Production deploy only.
[functions."daily-report-scheduled"]
  schedule = "0 3 * * *"

[[redirects]]
  # Redirect all routes to index.html for React Single Page App (SPA) client-side routing
  from = "/*"
  to = "/index.html"
  status = 200
